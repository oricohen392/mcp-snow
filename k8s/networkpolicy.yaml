# Allow only Dify to reach the MCP server, and the MCP server to reach only DNS
# and ServiceNow. Adjust the CHANGE_ME values to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servicenow-mcp
  labels:
    app.kubernetes.io/name: servicenow-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: servicenow-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: CHANGE_ME-dify-namespace
          # Optionally narrow to Dify's API/worker pods:
          # podSelector:
          #   matchLabels:
          #     app: dify-api
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Cluster DNS (OpenShift DNS pods listen on 5353; vanilla Kubernetes on 53)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # ServiceNow instance (or the egress proxy in front of it)
    - to:
        - ipBlock:
            cidr: CHANGE_ME/32
      ports:
        - port: 443
          protocol: TCP
