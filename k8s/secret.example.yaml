# TEMPLATE ONLY - do not commit real values.
# Create the real secret with, for example:
#   oc create secret generic servicenow-mcp-secret \
#     --from-literal=SERVICENOW_USERNAME=... \
#     --from-literal=SERVICENOW_PASSWORD=... \
#     --from-literal=MCP_AUTH_TOKEN="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: servicenow-mcp-secret
  labels:
    app.kubernetes.io/name: servicenow-mcp
type: Opaque
stringData:
  SERVICENOW_USERNAME: "CHANGE_ME"
  SERVICENOW_PASSWORD: "CHANGE_ME"
  # Optional. When set, Dify must send "Authorization: Bearer <token>" to /sse and /messages/.
  # Remove this key to run without endpoint authentication (then rely on the NetworkPolicy).
  MCP_AUTH_TOKEN: "CHANGE_ME"
