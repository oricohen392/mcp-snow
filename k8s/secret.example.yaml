# TEMPLATE ONLY - do not commit real values.
# Create the real secret with, for example:
#   oc create secret generic servicenow-mcp-secret \
#     --from-literal=OAUTH_CLIENT_ID=... \
#     --from-literal=OAUTH_CLIENT_SECRET=... \
#     --from-literal=SERVICENOW_USERNAME=... \
#     --from-literal=SERVICENOW_PASSWORD=... \
#     --from-literal=MCP_AUTH_TOKEN="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: servicenow-mcp-secret
  labels:
    app.kubernetes.io/name: servicenow-mcp
type: Opaque
stringData:
  # Upstream OAuth / OIDC credentials (from IdP or ServiceNow Application Registry)
  OAUTH_CLIENT_ID: "CHANGE_ME"
  OAUTH_CLIENT_SECRET: "CHANGE_ME"

  # Optional service-account credentials.
  # Only used when ALLOW_SERVICE_ACCOUNT_FALLBACK is set to "true".
  SERVICENOW_USERNAME: "CHANGE_ME"
  SERVICENOW_PASSWORD: "CHANGE_ME"

  # Optional shared token. When ALLOW_SERVICE_ACCOUNT_FALLBACK="true", requests
  # providing "Authorization: Bearer <MCP_AUTH_TOKEN>" will use the service account above.
  MCP_AUTH_TOKEN: "CHANGE_ME"

