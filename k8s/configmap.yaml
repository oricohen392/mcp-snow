apiVersion: v1
kind: ConfigMap
metadata:
  name: servicenow-mcp-config
  labels:
    app.kubernetes.io/name: servicenow-mcp
data:
  # Not secret. Credentials live in the Secret (secret.example.yaml).
  SERVICENOW_INSTANCE_URL: "https://your-instance.service-now.com"
  SERVICENOW_TIMEOUT: "30"
  # Write tools are only registered when this is explicitly "false".
  READ_ONLY: "true"
  # One of: full, service_desk, change_coordinator, ... (config/tool_packages.yaml).
  # An invalid name makes the pod fail at startup (check the logs).
  MCP_TOOL_PACKAGE: "full"
  LOG_LEVEL: "INFO"            # DEBUG logs every ServiceNow request (path, sysparm_*, status, ms)
  MAX_LIMIT: "100"
  DEFAULT_TIMEZONE: "UTC"      # e.g. "Asia/Jerusalem"; used for dates given without an offset
  CHOICE_CACHE_TTL_SECONDS: "3600"

  # Centralized Multi-User / OAuth / OIDC Configuration
  # External public base URL of this MCP server (used for OAuth discovery & callbacks).
  # Strongly recommended in production to prevent Host header injection and guarantee consistent OAuth metadata.
  # MCP_PUBLIC_URL: "https://mcp-snow.example.com"
  # OIDC issuer URL for auto-discovery (.well-known/openid-configuration)
  # OIDC_ISSUER_URL: "https://login.microsoftonline.com/<tenant-id>/v2.0"
  # Explicit OAuth endpoints (optional override if not using OIDC discovery)
  # OAUTH_AUTHORIZE_URL: "https://your-instance.service-now.com/oauth_auth.do"
  # OAUTH_TOKEN_URL: "https://your-instance.service-now.com/oauth_token.do"
  # Space-delimited scopes requested during OAuth authorization
  # OAUTH_SCOPES: "openid profile email"
  # Header used when clients pass X-ServiceNow-API-Key (default: x-sn-apikey)
  SERVICENOW_API_KEY_HEADER: "x-sn-apikey"
  # Require per-user auth by default. Set to "true" only to allow service-account fallback.
  ALLOW_SERVICE_ACCOUNT_FALLBACK: "false"
  # Lifetime in seconds for mcp_<token> user sessions before refresh (default: 86400 / 24h)
  SESSION_TTL_SECONDS: "86400"
  # Absolute lifetime ceiling in seconds regardless of token refreshes (default: 604800 / 7 days)
  SESSION_ABSOLUTE_LIFETIME_SECONDS: "604800"
  # Require interactive user consent on /oauth/authorize before redirecting to IdP (default: false)
  REQUIRE_OAUTH_CONSENT: "false"
  # Allow unverified arbitrary bearer tokens (default: false — requires OIDC JWT or registered session)
  ALLOW_BEARER_PASSTHROUGH: "false"


